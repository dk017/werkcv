name: Build app image

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Hetzner after pushing the image"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deploy_dir:
        description: "Remote checkout directory"
        required: true
        default: "/opt/werkcv"
      run_signup_feedback:
        description: "Run the signup feedback outreach after deploy"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      signup_feedback_days:
        description: "Signup window in days for the outreach"
        required: true
        default: "14"
      indexnow_paths:
        description: "Changed page paths to submit to IndexNow after deploy (space or comma separated, e.g. /cv-check /prijzen). Empty = skip."
        required: false
        default: ""
      prune_dangling_images:
        description: "Remove only untagged Docker images on the deploy host"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          OWNER_LC="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER_LC}/werkcv-app" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_BUILD_ID=${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy image to Hetzner
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.inputs.deploy == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Copy compose override
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.ghcr.yml"
          target: "${{ github.event.inputs.deploy_dir }}"

      - name: Pull and restart app
        uses: appleboy/ssh-action@v1.2.0
        env:
          WERKCV_IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
          APP_BUILD_ID: ${{ needs.build.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: WERKCV_IMAGE,APP_BUILD_ID,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "${{ github.event.inputs.deploy_dir }}"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi
            docker compose -p werkcv -f docker-compose.ghcr.yml pull app
            docker compose -p werkcv -f docker-compose.ghcr.yml up -d app
            docker compose -p werkcv ps
            if [ "${{ github.event.inputs.prune_dangling_images }}" = "true" ]; then
              docker image prune -f
            fi

      # Tell Bing (and other IndexNow engines, e.g. used by DuckDuckGo, Ecosia and Yahoo results)
      # which pages changed. Only the given paths are sent; unchanged pages should not be resubmitted.
      - name: Submit changed pages to IndexNow
        if: ${{ github.event.inputs.indexnow_paths != '' }}
        env:
          INDEXNOW_PATHS: ${{ github.event.inputs.indexnow_paths }}
          EXPECTED_BUILD: ${{ needs.build.outputs.tag }}
        run: |
          set -eu
          host="werkcv.nl"
          key_file="$(ls public | grep -E '^[a-f0-9]{32}\.txt$' | head -n1)"
          key="${key_file%.txt}"
          [ -n "$key" ] || { echo "IndexNow key file not found in public/"; exit 1; }
          # Wait until the new build is live, so engines fetch the updated pages.
          for i in $(seq 1 30); do
            live="$(curl -fsS "https://$host/api/build-version" | sed -n 's/.*"buildId":"\([^"]*\)".*/\1/p' || true)"
            [ "$live" = "$EXPECTED_BUILD" ] && break
            sleep 10
          done
          urls=""
          for p in $(echo "$INDEXNOW_PATHS" | tr ',' ' '); do
            case "$p" in
              /api/*|/admin*|/editor*|/en/editor*|/login*|/success*|/mijn-cvs*) echo "Skipping private path $p"; continue ;;
              /*) urls="$urls\"https://$host$p\"," ;;
              *) echo "Skipping invalid path $p (must start with /)" ;;
            esac
          done
          [ -n "$urls" ] || { echo "No valid paths to submit"; exit 0; }
          body="{\"host\":\"$host\",\"key\":\"$key\",\"keyLocation\":\"https://$host/$key_file\",\"urlList\":[${urls%,}]}"
          status="$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' -X POST https://api.indexnow.org/IndexNow -H 'Content-Type: application/json; charset=utf-8' -d "$body")"
          echo "IndexNow responded $status"; cat /tmp/indexnow.out || true
          case "$status" in 200|202) ;; *) echo "IndexNow submission failed"; exit 1 ;; esac

      - name: Run signup feedback outreach
        if: ${{ github.event.inputs.run_signup_feedback == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -eu
            cd "${{ github.event.inputs.deploy_dir }}"
            docker compose -p werkcv -f docker-compose.ghcr.yml exec -T app \
              sh -lc 'FOLLOWUP_FROM_EMAIL=contact@werkcv.nl FOLLOWUP_REPLY_TO=contact@werkcv.nl FOLLOWUP_DELIVERY_MODE=resend node scripts/followups-signup-feedback.mjs --days=${{ github.event.inputs.signup_feedback_days }}'
